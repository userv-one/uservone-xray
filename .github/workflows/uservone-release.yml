name: uservone legacy release

on:
  push:
    tags:
      - 'v26.7.28-uservone.*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Download dependencies
        run: go mod download
      - name: Download geodata
        run: |
          mkdir -p resources
          curl -fLsS https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat -o resources/geoip.dat
          curl -fLsS https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat -o resources/geosite.dat
          curl -fLsS https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat.sha256sum -o resources/geoip.expected
          curl -fLsS https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat.sha256sum -o resources/geosite.expected
          test "$(sha256sum resources/geoip.dat | awk '{print $1}')" = "$(awk '{print $1}' resources/geoip.expected)"
          test "$(sha256sum resources/geosite.dat | awk '{print $1}')" = "$(awk '{print $1}' resources/geosite.expected)"
      - name: Test full project
        run: go test ./...
      - name: Vet full project
        run: go vet ./...
      - name: Validate configurations
        run: |
          go run ./main run -test -config examples/uservone.server.json
          go run ./main run -test -config examples/uservone.vless-reality.client.json
      - name: Check version-json
        run: |
          mkdir -p build_assets
          go run ./main version-json > build_assets/version.json
          python3 - <<'PY'
          import json
          with open('build_assets/version.json', encoding='utf-8') as source:
              info = json.load(source)
          assert info['name'] == 'uservone Xray 26.7.28'
          assert info['version'] == '26.7.28'
          assert info['upstream'] == 'XTLS/Xray-core'
          assert info['upstream_commit'] == '5ca6f4b7d4dc20a881d4330e498892697627ec0c'
          assert info['fork'] == 'uservone-keepalive.1'
          assert info['build']
          assert info['wire_compatibility'] == ['VLESS', 'REALITY', 'XTLS Vision', 'Shadowsocks 2022', 'SOCKS5']
          PY
      - name: Build host binary
        run: |
          mkdir -p build_assets
          CGO_ENABLED=0 go build -o build_assets/uservone-xray-host -trimpath -buildvcs=true ./main
      - name: Check legacy banner
        run: |
          ./build_assets/uservone-xray-host version | grep 'Xray 26.7.28'
          ./build_assets/uservone-xray-host version | grep '5ca6f4b'

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    env:
      GOOS: linux
      CGO_ENABLED: 0
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Download dependencies
        run: go mod download
      - name: Build Linux binary
        run: |
          mkdir -p dist
          go build -o "dist/uservone-xray-26728-linux-${GOARCH}" -trimpath -buildvcs=false -ldflags="-X github.com/xtls/xray-core/core.build=${GITHUB_SHA::7} -s -w -buildid=" ./main
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: uservone-xray-26728-linux-${{ matrix.goarch }}
          path: dist/uservone-xray-26728-linux-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 7

  release:
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Generate and verify checksums
        run: |
          cd dist
          chmod 0755 uservone-xray-26728-linux-*
          sha256sum uservone-xray-26728-linux-amd64 uservone-xray-26728-linux-arm64 > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Generate buildinfo.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          UPSTREAM_COMMIT: 5ca6f4b7d4dc20a881d4330e498892697627ec0c
        run: |
          export VERSION_JSON="$(./dist/uservone-xray-26728-linux-amd64 version-json)"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('dist')
          artifacts = {}
          for name in ('uservone-xray-26728-linux-amd64', 'uservone-xray-26728-linux-arm64'):
              artifacts[name] = hashlib.sha256((root / name).read_bytes()).hexdigest()
          version_json = json.loads(os.environ['VERSION_JSON'])
          info = {
              'name': version_json['name'],
              'version': version_json['version'],
              'release_tag': os.environ['RELEASE_TAG'],
              'commit': os.environ['RELEASE_COMMIT'],
              'build': version_json['build'],
              'fork': version_json['fork'],
              'upstream': {
                  'repository': 'https://github.com/XTLS/Xray-core',
                  'tag': 'v26.7.28',
                  'commit': os.environ['UPSTREAM_COMMIT'],
              },
              'go_version': version_json['go_version'],
              'artifacts': artifacts,
              'wire_compatibility': version_json['wire_compatibility'],
          }
          (root / 'buildinfo.json').write_text(json.dumps(info, indent=2, sort_keys=True) + '\n')
          PY
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          path: ./
          format: spdx-json
          output-file: dist/sbom.spdx.json
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: false
          prerelease: false
          files: dist/*
